<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudentHub | Register</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <main class="auth-container">
      <section class="auth-card">
        <div class="brand">
          <div class="brand-icon">S</div>
          <h1>Student<span>Hub</span></h1>
        </div>

        <p class="subtitle">Get started</p>
        <h2>Create your account</h2>
        <p class="description">Register to access your student portal.</p>

        <form id="registerForm">
          <div class="form-group">
            <label for="name">Full name</label>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="Enter your full name"
              autocomplete="name"
              required
            />
          </div>

          <div class="form-group">
            <label for="email">Email address</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="you@example.com"
              autocomplete="email"
              required
            />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="At least 8 characters"
              minlength="8"
              autocomplete="new-password"
              required
            />
          </div>

          <p id="message" class="message" role="alert" aria-live="polite"></p>

          <button type="submit" class="primary-button">Create Account</button>
        </form>

        <p class="auth-footer">
          Already have an account?
          <a href="index.html">Sign in</a>
        </p>
      </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/register.js"></script>
  </body>
</html>
